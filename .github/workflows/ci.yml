name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same branch / PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Any ESLint error (or warning, via --max-warnings 0) exits non-zero and fails the job.
      - name: Run ESLint
        run: npm run lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Any failing Jest test exits non-zero and fails the job.
      - name: Run Jest with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # The image is only built if lint and tests pass.
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lms-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test with a throwaway secret generated inside this job; nothing is stored.
      - name: Smoke test container
        run: |
          docker run -d --name lms -p 3000:3000 \
            -e JWT_SECRET="$(openssl rand -hex 32)" lms-app:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then
              echo
              docker rm -f lms
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy" >&2
          docker logs lms
          docker rm -f lms
          exit 1
